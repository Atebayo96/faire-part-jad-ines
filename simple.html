<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4ecd8">
  <title>Inès &amp; Jad — 17 octobre 2026</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23b8975a'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23e8cf8b' stroke-width='2'/%3E%3C/svg%3E">
  <meta property="og:title" content="Inès & Jad — 17 octobre 2026">
  <meta property="og:description" content="Mairie à 13h30, Le Palacio dès 18h">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Inès & Jad">
  <meta property="og:url" content="https://ines-et-jad.vercel.app/simple.html">
  <meta property="og:image" content="https://ines-et-jad.vercel.app/assets/og_preview.jpg">
  <meta property="og:image:width" content="768">
  <meta property="og:image:height" content="768">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://ines-et-jad.vercel.app/assets/og_preview.jpg">
  <style>
    /* Version simple : tout tient sur un seul écran, sans enveloppe, sans animation, sans défilement. */
    @font-face { font-family:"Playfair"; src:url("fonts/PlayfairDisplay.ttf") format("truetype"); font-display:swap; }
    @font-face { font-family:"Amiri"; src:url("fonts/Amiri.ttf") format("truetype"); font-display:swap; }
    @font-face { font-family:"Script"; src:url("fonts/GreatVibes.ttf") format("truetype"); font-display:swap; }

    :root{ --ink:#2c2114; --soft:#5a4632; --gold:#b8975a; --brown:#5a3f1c; --paper:#f4ecd8; --card:#fffaf0; }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:var(--paper);overflow:hidden}
    body{font-family:"Amiri",Georgia,serif;color:var(--ink)}
    main{height:100svh;width:min(100%,520px);margin:0 auto;display:flex;flex-direction:column;background:var(--paper)}

    /* image du haut : les mains et la bague, qui se réduit si l'écran est petit */
    .pic{flex:0 1 36svh;min-height:90px;background:url("hero_frames_mir/frame_001.webp") center 45%/cover no-repeat;
      -webkit-mask-image:linear-gradient(to bottom,transparent,#000 10%,#000 78%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 10%,#000 78%,transparent)}
    /* la basmala sur le papier, au-dessus de l'image : jamais sur les mains */
    .basmala{flex:0 0 auto;margin:0;padding:max(10px,env(safe-area-inset-top)) 0 4px;text-align:center;
      font-size:clamp(20px,6vw,26px);line-height:1.5;color:var(--brown)}

    /* le texte remonte sous l'image ; la place en trop va en bas */
    .txt{flex:1 0 auto;display:flex;flex-direction:column;justify-content:flex-start;padding:2.5svh 16px calc(14px + env(safe-area-inset-bottom));text-align:center}
    .evs{width:100%}
    h1{margin:0;font:400 clamp(40px,12vw,52px)/1.05 "Script",cursive;color:var(--ink)}
    h1 .amp{color:var(--gold)}
    .inv{margin:4px 0 0;font:italic 400 16px/1.4 "Playfair",serif;color:var(--soft)}
    .date{margin:4px 0 0;font:600 clamp(19px,5.4vw,22px)/1.25 "Playfair",serif;letter-spacing:.03em;color:var(--ink)}

    .evs{display:grid;gap:10px;margin:16px auto 0;max-width:420px}
    .ev{display:grid;grid-template-columns:auto 1fr;column-gap:14px;row-gap:10px;align-items:center;text-align:left;
      padding:12px 14px;border-radius:14px;background:var(--card);box-shadow:0 1px 0 rgba(90,63,28,.12),0 6px 18px rgba(90,63,28,.08)}
    .h{font:600 30px/1 "Playfair",serif;font-variant-numeric:lining-nums tabular-nums;color:var(--ink);min-width:3.1em}
    .w{font:600 18px/1.25 "Playfair",serif;color:var(--ink)}
    .w small{display:block;margin-top:2px;font:400 16px/1.3 "Amiri",serif;color:var(--soft)}
    /* l'adresse est le lien vers Google Maps (dans la page comme dans le PDF) */
    a.ev{text-decoration:none;color:inherit}
    .w small u{text-decoration:underline;text-decoration-color:rgba(184,151,90,.7);text-underline-offset:3px}
    a.ev:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

    /* écrans très bas : on resserre un peu */
    @media (max-height:640px){ .ev{padding:10px 12px} .evs{margin-top:12px} }
    /* PDF / impression : une seule page au format du téléphone */
    @page{size:390px 844px;margin:0}
    @media print{
      html,body{height:auto;overflow:visible;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      main{height:844px;width:390px}
    }
  </style>
</head>
<body>
  <main>
    <p class="basmala" dir="rtl" lang="ar" aria-label="Bismillah ar-Rahman ar-Rahim">﷽</p>
    <div class="pic" aria-hidden="true"></div>
    <div class="txt">
      <h1>Inès <span class="amp">&amp;</span> Jad</h1>
      <p class="inv">vous convient à leur mariage</p>
      <p class="date">Samedi 17 octobre 2026</p>

      <div class="evs">
        <a class="ev" target="_blank" rel="noreferrer" href="https://www.google.com/maps/search/?api=1&query=H%C3%B4tel%20de%20Ville%20de%20Nanterre%201%20place%20du%2027%20mars%202002%2092000%20Nanterre">
          <span class="h">13h30</span>
          <span class="w">Cérémonie civile<small><u>Hôtel de Ville de Nanterre<br>1 place du 27 mars 2002<br>92000 Nanterre</u></small></span>
        </a>
        <a class="ev" target="_blank" rel="noreferrer" href="https://www.google.com/maps/search/?api=1&query=Le%20Palacio%20R%C3%A9ception%2015%20rue%20Camille%20Flammarion%2091630%20Avrainville">
          <span class="h">18h</span>
          <span class="w">Réception<small><u>Le Palacio Réception<br>15 rue Camille Flammarion<br>91630 Avrainville</u></small></span>
        </a>
      </div>
    </div>
  </main>

</body>
</html>
