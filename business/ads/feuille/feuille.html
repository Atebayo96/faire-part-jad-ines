<!doctype html><html lang="fr"><head><meta charset="utf-8">
<!-- Pubs « feuille » (TikTok, Reels, 9:16) : la Carte et la Page unique, avec les vraies feuilles dessinées par carte.js
     (fiches de démo de business/invites, injectées par render.js dans window.FICHES), voix off et musique ElevenLabs (audio/).
     Trois montages (window.V) :
       univers : « Cinq univers. Un seul vous ressemble. » le carrousel des feuilles, un univers par nom dit par la voix ;
       details : gros plans chuchotés (sceau, prénoms gaufrés, icônes dorées, papier), puis la feuille envoyée par message ;
       mamie   : « Mamie reçoit votre faire-part » : elle ouvre la page, répond, et le vrai tableau de bord des mariés.
     render(t) est déterministe ; render.js filme image par image et mixe le son d'après window.AUDIO. Aucune image générée. -->
<link rel="stylesheet" href="/polices/polices.css">
<link rel="stylesheet" href="/carte.css">
<style>
:root{--ink:#16140f;--mute:#6b665d;--bg:#f6f2ea;--gold:#8a6a2c;--red:#a8322a}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
#st{position:absolute;inset:0;overflow:hidden;background:radial-gradient(100% 70% at 50% 55%,#fffdf8 0%,var(--bg) 75%)}
.abs{position:absolute}
.cap{left:60px;right:60px;text-align:center;color:var(--ink);font:500 74px/1.08 "Cormorant Garamond",serif;opacity:0}
.cap i{font-style:italic;font-weight:400;color:var(--gold)}
.cap small{display:block;font:600 26px/1 Inter,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);margin-bottom:22px}
/* la feuille, toujours dessinée à 360 × 740 puis réduite ou agrandie (comme .fl-in de la vitrine) */
.box{position:absolute;overflow:hidden;background:#e9e4da}
.fl-in{position:absolute;left:0;top:0;width:360px;height:740px;transform-origin:0 0;display:flex;flex-direction:column;pointer-events:none}
.fl-in .ct{min-height:100%}
/* téléphone : écran 540 × 1110 (la feuille à 1,5) */
#ph{left:252px;top:360px;width:576px;height:1146px;border-radius:78px;background:#0d0d0f;padding:18px;box-shadow:0 60px 110px -30px rgba(40,25,5,.42),0 0 0 2px #2b2b30 inset;transform-origin:50% 50%}
#scr{position:relative;width:540px;height:1110px;border-radius:62px;overflow:hidden;background:#fff}
#scr>.box{left:0;top:0;width:540px;height:1110px}
#tap{width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;background:rgba(20,20,20,.26);border:3px solid rgba(255,255,255,.92);z-index:40;opacity:0}
/* messagerie (générique) */
#chat{position:absolute;inset:0;background:#ece5d8;font-family:Inter,sans-serif;opacity:0}
#chat .hd{height:150px;background:#fbf8f2;display:flex;align-items:flex-end;gap:18px;padding:0 26px 22px;border-bottom:1px solid #e2dacb}
#chat .av{width:62px;height:62px;border-radius:50%;background:#b9a27a;color:#fff;display:flex;align-items:center;justify-content:center;font:600 28px/1 Inter}
#chat .hd b{display:block;font:600 27px/1.2 Inter;color:#1d1a16}#chat .hd small{font:500 20px/1.3 Inter;color:#7a7365}
.bub{position:absolute;max-width:80%;padding:14px 18px;border-radius:24px;font:500 24px/1.35 Inter;color:#1d1a16;box-shadow:0 1px 1px rgba(0,0,0,.08);opacity:0}
.bub.in{left:20px;background:#fff;border-top-left-radius:6px}
.bub.out{right:20px;background:#e3f1d9;border-top-right-radius:6px}
.bub .who{display:block;font:600 19px/1 Inter;color:#9a6a2c;margin-bottom:8px}
.bub .tm{display:block;text-align:right;font:500 17px/1 Inter;color:#8a8475;margin-top:6px}
.bub .thumb{position:relative;width:300px;height:617px;border-radius:14px;overflow:hidden;margin:-2px -4px 10px}
.bub .lnk{position:relative;width:380px;border-radius:16px;overflow:hidden;background:#f6f3ee;margin:-4px -6px 12px}
.bub .lnk .box{position:relative;width:380px;height:300px}
.bub .lnk div.t{padding:12px 16px}.bub .lnk b{display:block;font:600 23px/1.25 Inter}.bub .lnk small{display:block;margin-top:6px;font:500 19px/1 Inter;color:#7a7365}
/* formulaire de réponse (feuille qui monte, comme sur le faire-part) */
#form{position:absolute;left:0;right:0;bottom:0;height:720px;border-radius:40px 40px 0 0;background:#fffdf9;box-shadow:0 -20px 60px rgba(0,0,0,.25);padding:44px 40px;transform:translateY(110%);font-family:Inter,sans-serif;z-index:20}
#form h4{font:500 44px/1.1 "Cormorant Garamond",serif;color:var(--ink);text-align:center}
#form .sub{font:500 21px/1.3 Inter;color:var(--mute);text-align:center;margin:10px 0 30px}
#form .row{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-top:1px solid #ece6da}
#form .row b{font:600 27px/1 Inter;color:#1d1a16}
#form .yn{display:flex;gap:10px}
#form .yn span{height:58px;min-width:96px;padding:0 22px;border-radius:29px;border:2px solid #e3dccd;display:flex;align-items:center;justify-content:center;font:600 23px/1 Inter;color:#3d3a33}
#form .yn span.on{background:var(--ink);border-color:var(--ink);color:#fff}
#form .mn{display:flex;gap:10px;margin-top:4px}
#form .mn span{height:52px;padding:0 20px;border-radius:26px;background:#f2ede3;display:flex;align-items:center;font:500 21px/1 Inter;color:#3d3a33}
#form .mn span.on{background:#8a6a2c;color:#fff}
#form .go{margin-top:34px;height:84px;border-radius:42px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font:500 34px/1 "Cormorant Garamond",serif}
#merci{position:absolute;inset:0;background:#fffdf9;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;border-radius:40px 40px 0 0}
#merci .ok{width:120px;height:120px;border-radius:50%;background:#2f6b45;color:#fff;font:600 64px/120px Inter;text-align:center}
#merci p{margin-top:26px;font:500 46px/1.1 "Cormorant Garamond",serif;color:var(--ink)}
#toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:rgba(22,20,15,.9);color:#fff;border-radius:30px;padding:18px 30px;font:600 22px/1 Inter,sans-serif;white-space:nowrap;opacity:0;z-index:30}
/* le vrai tableau de bord des mariés (capture du site) */
#tb{position:absolute;inset:0;opacity:0;background:#fff;z-index:25;overflow:hidden}
#tb img{position:absolute;left:0;top:0;width:540px}
/* carrousel des univers */
#car{left:0;right:0;top:330px;height:960px;perspective:2200px;perspective-origin:50% 40%}
#car .box{left:50%;top:0;margin-left:-220px;border-radius:30px;box-shadow:0 46px 70px -28px rgba(30,24,12,.45),0 8px 18px rgba(30,24,12,.12);backface-visibility:hidden}
#lab{left:0;right:0;top:1310px;text-align:center;color:var(--ink)}
#lab .n{font:500 66px/1 "Cormorant Garamond",serif}
#lab .s{margin-top:16px;font:500 28px/1 Inter,sans-serif;color:var(--mute)}
/* gros plans */
.cam{position:absolute;left:0;top:0;width:360px;height:740px;transform-origin:0 0;opacity:0}
.cam .fl-in{position:absolute}
.cap.pi{left:50%;right:auto;transform:translateX(-50%);white-space:nowrap;background:rgba(251,248,242,.94);border-radius:60px;padding:24px 46px;font-size:60px;box-shadow:0 20px 50px -20px rgba(30,20,5,.4)}
/* étiquette sous le téléphone */
.pill{left:50%;white-space:nowrap;background:var(--ink);color:#fbf7ef;border-radius:60px;padding:22px 46px;font:500 40px/1 "Cormorant Garamond",serif;opacity:0}
.pill small{font:600 20px/1 Inter;letter-spacing:.18em;text-transform:uppercase;color:#cdbf9f;margin-left:16px;vertical-align:middle}
/* trois papiers, carte ou page */
.tri{opacity:0}
.tri .box{border-radius:22px;box-shadow:0 30px 60px -24px rgba(40,25,5,.45)}
.tri .tag{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);white-space:nowrap;background:rgba(22,20,15,.88);color:#fff;border-radius:24px;padding:12px 22px;font:600 20px/1 Inter,sans-serif;letter-spacing:.06em}
.tri .lb{position:absolute;left:0;right:0;text-align:center;font:500 46px/1 "Cormorant Garamond",serif;color:var(--ink)}
.tri .lb small{display:block;margin-top:10px;font:600 21px/1.3 Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
/* fin */
#end{inset:0;z-index:50;opacity:0;background:radial-gradient(100% 70% at 50% 45%,#fffdf8 0%,var(--bg) 75%)}
#endseal{left:50%;top:420px;width:230px;height:230px;margin-left:-115px;background:url(/img/seals/or.webp) center/contain no-repeat;display:flex;align-items:center;justify-content:center;
  font:400 110px/1 "Great Vibes",cursive;color:#6e4f17;text-shadow:-1px -1px 0 rgba(255,236,170,.55),1px 1px 1px rgba(60,35,5,.7)}
#logo{left:0;right:0;top:720px;text-align:center;color:var(--ink);white-space:nowrap}
#logo span{font:500 40px/1 "Inter Tight",Inter,sans-serif;letter-spacing:.32em;text-transform:uppercase}
#logo b{font:400 180px/1 "Great Vibes",cursive;font-weight:400;margin-left:12px;position:relative;top:15px}
#etag{top:980px;opacity:1}
#price{left:50%;top:1240px;white-space:nowrap;background:var(--ink);color:#fbf7ef;border-radius:60px;padding:28px 56px;font:500 44px/1 "Cormorant Garamond",serif}
#url{left:0;right:0;top:1400px;text-align:center;font:500 32px/1 Inter,sans-serif;letter-spacing:.16em;color:var(--mute)}
</style></head><body>
<div id="st">
  <div id="caps"></div>
  <div id="ph" class="abs"><div id="scr">
    <div id="lays"></div>
    <div id="chat"><div class="hd"><div class="av" id="cav">F</div><div><b id="cnm">Famille</b><small id="cmb"></small></div></div><div id="bubs"></div></div>
    <div id="toast"></div>
    <div id="form"><h4>Serez-vous des nôtres ?</h4><p class="sub">Réponse souhaitée avant le 15 mai</p>
      <div class="row"><b>Mamie</b><div class="yn"><span id="y1">Oui</span><span>Non</span></div></div>
      <div class="row"><b>Papi</b><div class="yn"><span id="y2">Oui</span><span>Non</span></div></div>
      <div class="row" style="display:block"><b>Menu</b><div class="mn" style="margin-top:16px"><span id="m1">Poisson</span><span>Viande</span><span>Végétarien</span></div></div>
      <div class="go" id="go">Envoyer ma réponse</div>
      <div id="merci"><div class="ok">✓</div><p>Merci Mamie !</p></div></div>
    <div id="tb"><img src="/_caps/tb.png" alt=""></div>
    <div id="tap" class="abs"></div>
  </div></div>
  <div id="cams" class="abs" style="inset:0"></div>
  <div id="car" class="abs"></div>
  <div id="lab" class="abs"><div class="n"></div><div class="s"></div></div>
  <div id="caps2"></div>
  <div id="end" class="abs">
    <div id="endseal" class="abs">O</div>
    <div id="logo" class="abs"><span>Save the</span><b>Oui</b></div>
    <div id="etag" class="abs cap"></div>
    <div id="price" class="abs"></div>
    <div id="url" class="abs">SAVETHEOUI.FR</div>
  </div>
</div>
<script src="/themes.js"></script>
<script src="/carte.js"></script>
<script>
const V=window.V||'univers', F=window.FICHES, TH=window.SCEAU_THEMES;
const $=id=>document.getElementById(id);
const lin=(t,a,b)=>Math.min(1,Math.max(0,(t-a)/(b-a))), eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{ const c=1.7; return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2); };
const S=(el,o,tf)=>{ el.style.opacity=o; if(tf!=null) el.style.transform=tf; };
const ORD=['page-emma-louis','carte-camille-antoine','page-victoire-charles','page-nour-ilyes','page-leila-mehdi'];
// une feuille dans une case de largeur w (la hauteur suit, 360 × 740)
function sheet(parent,inv,w,live){ const b=document.createElement('div'); b.className='box'; b.style.width=w+'px'; b.style.height=Math.round(w*740/360)+'px';
  b.innerHTML=`<div class="fl-in">${SceauCarte.html(inv,{fit:true,live:!!live})}</div>`; b.firstChild.style.transform=`scale(${w/360})`; parent.appendChild(b); b._in=b.firstChild; return b; }
const SHEETS=[];
function layer(inv,live){ const b=sheet($('lays'),inv,540,live); b.style.height='1110px'; b.style.position='absolute'; b.style.opacity=0; SHEETS.push(b); return b; }
// légendes en haut : [début, fin, html]
const CAPS=[]; function cap(a,b,h,top){ const d=document.createElement('div'); d.className='abs cap'; d.style.top=(top||150)+'px'; d.innerHTML=h; $('caps').appendChild(d); CAPS.push([a,b,d]); }
function caps(t){ CAPS.forEach(([a,b,d])=>{ const o=Math.min(eo(lin(t,a,a+.35)),1-lin(t,b-.3,b)); S(d,o,`translateY(${(1-eo(lin(t,a,a+.35)))*26}px)`); }); }
// toucher : [instant, élément ou {x,y} dans l'écran]
function tapAt(t,taps){ const el=$('tap'); let o=0;
  for(const [at,pt] of taps){ const k=lin(t,at-.35,at), u=lin(t,at,at+.35); if(k>0&&u<1){ const p=typeof pt==='function'?pt():pt;
    el.style.left=p.x+'px'; el.style.top=p.y+'px'; o=k<1?eo(k):1-u; el.style.transform=`scale(${k<1?1.25-.25*eo(k):1-.2*Math.sin(Math.PI*u)})`; } }
  el.style.opacity=o; }
// centre d'un élément de la feuille, en coordonnées de l'écran (#scr)
function ptOf(el){ const s=$('scr').getBoundingClientRect(), r=el.getBoundingClientRect(), k=$('ph')._k||1; return {x:(r.left+r.width/2-s.left)/k,y:(r.top+r.height/2-s.top)/k}; }
function phone(x,y,sc,o){ const p=$('ph'); p._k=sc; S(p,o,`translate(${x}px,${y}px) scale(${sc})`); }
function bub(cls,html,top){ const d=document.createElement('div'); d.className='bub '+cls; d.style.top=top+'px'; d.innerHTML=html; $('bubs').appendChild(d); return d; }
function popIn(el,t,a){ const k=lin(t,a,a+.3); S(el,eo(k),`translateY(${(1-eo(k))*24}px) scale(${.96+.04*eo(k)})`); }
function endCard(t,a,tag,price){ $('etag').innerHTML=tag; $('price').innerHTML=price;
  S($('end'),eo(lin(t,a,a+.45)));
  const sk=back(lin(t,a+.2,a+.75)); S($('endseal'),lin(t,a+.2,a+.4),`scale(${.6+.4*sk}) rotate(${(1-sk)*-12}deg)`);
  S($('logo'),eo(lin(t,a+.45,a+.9)),`translateY(${(1-eo(lin(t,a+.45,a+.9)))*30}px)`);
  S($('etag'),eo(lin(t,a+.8,a+1.2)),`translateY(${(1-eo(lin(t,a+.8,a+1.2)))*30}px)`);
  const pr=back(lin(t,a+1.1,a+1.6)); S($('price'),lin(t,a+1.1,a+1.3),`translateX(-50%) scale(${.85+.15*pr})`);
  S($('url'),eo(lin(t,a+1.4,a+1.9))); }

let render;
// son : musique (ElevenLabs) et voix off découpée en morceaux [fichier, début dans la vidéo, depuis, jusqu'à] (audio/, voix.py, musique.py)
window.AUDIO={univers:{d:15.5,music:'m-univers',vo:[['univers',.3,0,13]]},
  details:{d:17,music:'m-details',vo:[['details',.5,0,14.4]]},
  mamie:{d:18,music:'m-mamie',vo:[['mamie',.4,0,1.6],['mamie',3.55,1.62,4.3],['mamie',7.05,4.35,5.9],['mamie',11.25,5.9,7.85],['mamie',15.7,8.75,9.85]]}}[V];
/* ---------------- 1. univers : le carrousel des feuilles, un univers par mot de la voix ---------------- */
if(V==='univers'){
  $('ph').style.display='none';
  const W=440, cards=ORD.map(s=>{ const b=sheet($('car'),F[s],W,false); b.style.position='absolute'; return b; });
  const SH={dolcevita:'Riviera, citronniers, maïolique',doucefrance:'Bastide, lavande, oliviers',oldmoney:'Manoir, laurier, vert anglais',nuits:'Riad, lanternes, nuit étoilée',alhambra:'Zellige, jasmin, arcs andalous'};
  cap(-1,2.9,'Cinq univers.<br><i>Un seul vous ressemble.</i>',120);
  cap(8.3,12.2,'Tout votre faire-part,<br><i>sur une seule feuille.</i>',120);
  // la carte au centre, posée sur chaque nom dit par la voix
  const STOPS=[[0,2],[2.55,2],[3.0,0],[4.1,1],[5.12,2],[6.12,3],[7.25,4],[8.25,4]];
  const pos=t=>{ let p=STOPS[0][1]; for(let i=1;i<STOPS.length;i++){ const [a,v]=STOPS[i], pv=STOPS[i-1][1]; if(t>=a-.42) p=pv+(v-pv)*eio(lin(t,a-.42,a)); } return p; };
  render=t=>{
    caps(t);
    const p=pos(t)+.06*Math.sin(t*1.1)*(t<2.5?1:0), fin=eio(lin(t,8.3,9.0)), out=lin(t,12.1,12.5);
    cards.forEach((c,i)=>{ const d=i-p, a=d*.5, side=Math.abs(d)>.5?fin:0;
      const x=Math.sin(a)*640, z=-(1-Math.cos(a))*1000-side*400, ry=-d*24, intro=.5+.5*eo(lin(t,i*.05,.35+i*.05));
      const sc=i===4?1+.1*fin:1;
      c.style.transform=`translate3d(${x}px,${(1-intro)*300+side*60}px,${z}px) rotateY(${ry}deg) scale(${sc})`;
      c.style.opacity=(1-Math.max(0,Math.abs(d)-2.2))*(1-side)*(1-out); c.style.zIndex=100-Math.round(Math.abs(d)*10); });
    // le nom de l'univers, sous la carte centrale, pendant que la voix le dit
    const k=Math.round(p), named=t>=2.6&&t<8.3, th=TH[F[ORD[k]].theme];
    $('lab').querySelector('.n').textContent=named?th.name:'Dès 29 €'; $('lab').querySelector('.s').textContent=named?SH[F[ORD[k]].theme]:'Carte · Page unique dès 59 €';
    const lo=named?1-Math.min(1,Math.abs(p-k)*3):lin(t,10.6,10.9)*(1-out); S($('lab'),lo);
    endCard(t,12.25,'Votre faire-part,<br><i>sur une seule feuille.</i>','Carte 29 € · Page unique 59 €');
  };
}
/* ---------------- 2. détails : gros plans, voix chuchotée ---------------- */
if(V==='details'){
  $('car').style.display='none';
  // une caméra par plan : la feuille à 360 × 740, agrandie, centrée sur un élément
  const cam=(inv,sel,k0,k1,dx,dy)=>{ const c=document.createElement('div'); c.className='cam'; c.innerHTML=`<div class="fl-in">${SceauCarte.html(inv,{fit:true})}</div>`; $('cams').appendChild(c);
    return {c,sel,k0,k1,dx:dx||0,dy:dy||0,pt:null}; };
  const om=F['page-victoire-charles'], df=F['carte-camille-antoine'], dv=Object.assign({},F['page-emma-louis'],{icons:'or'});
  const SHOTS=[[cam(om,null,2.0,2.35),0,2.05],[cam(df,'.ct-seal',5.2,6.0,-10,0),2.05,3.5],[cam(om,'.ct-nm',3.3,3.7,-30,0),3.5,5.1],
    [cam(dv,'.ct-ic',7.5,8.6,0,-6),5.1,6.85],[cam(df,'.ct-dl',4.6,4.9,-60,0),6.85,9.3]];
  const CP=[[.5,2.0,'Regardez de plus près…'],[2.05,3.45,'Le sceau de cire.'],[3.5,5.05,'Les prénoms gaufrés.'],[5.1,6.8,'L’or des petits détails.'],[6.85,9.25,'Un papier qu’on a envie de toucher…'],[9.3,11.6,'Et pourtant, il arrive <i>par message.</i>']];
  CP.forEach(([a,b,h])=>cap(a,b,h,200)); CAPS.forEach(c=>c[2].classList.add('pi'));
  // la messagerie : la feuille d'Old money envoyée
  $('cav').textContent='V'; $('cnm').textContent='Victoire'; $('cmb').textContent='Famille de Villiers';
  const b1=bub('in','',190); b1.innerHTML='<span class="who">Victoire</span><div class="thumb"></div>Notre faire-part ! Réponse avant le 15 mai<span class="tm">18:42</span>';
  sheet(b1.querySelector('.thumb'),om,300,false);
  render=t=>{
    caps(t); CAPS.forEach(([a,b,d])=>{ d.style.transform='translateX(-50%) '+d.style.transform; });
    SHOTS.forEach(([s,a,b],i)=>{
      if(!s.pt){ const r=s.sel?s.c.querySelector(s.sel).getBoundingClientRect():null, o=s.c.getBoundingClientRect(), z=parseFloat((s.c.style.transform.match(/scale\(([\d.]+)/)||[0,1])[1]);
        s.pt=r?{x:(r.left+r.width/2-o.left)/z,y:(r.top+r.height/2-o.top)/z}:{x:180,y:370}; }
      const u=lin(t,a,b+.3), k=s.k0+(s.k1-s.k0)*u, x=540-(s.pt.x+s.dx*u)*k, y=(i?960:1000)-(s.pt.y+s.dy*u)*k;
      s.c.style.transform=`translate(${x}px,${y}px) scale(${k})`;
      s.c.style.opacity=(i===0?1:lin(t,a-.12,a+.18))*(i===SHOTS.length-1?1-lin(t,9.2,9.5):1-lin(t,b+.05,b+.3)); });
